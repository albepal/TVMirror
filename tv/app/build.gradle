plugins {
    id 'com.android.application'
}

android {
    namespace 'com.albertopalazzolo.tvmirror'
    compileSdk 35

    defaultConfig {
        applicationId 'com.albertopalazzolo.tvmirror'
        minSdk 26
        targetSdk 35
        versionCode 10002
        versionName '1.0.2'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Personal sideloaded app: the debug key is fine and keeps updates installable.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
